{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking failed — ParkVenue</title>
    <link rel="icon" type="image/png" href="{% static 'img/park.png' %}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{% static 'css/parkvenue.css' %}">
</head>
<body>
    <div class="bg-glow"></div>
    <div class="auth-page">
        <main class="auth-main" style="grid-column: 1 / -1;">
            <div class="auth-card" style="max-width: 460px; text-align: center;">
                <div class="es-icon" style="width: 84px; height: 84px; font-size: 2.2rem; margin: 0 auto 20px; color: #fcd34d; background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.35);">
                    <i class='bx bx-car'></i>
                </div>
                <h1>{{ message|default:"No slots available!" }}</h1>
                <p class="auth-sub">This spot just filled up. Don't worry — there are more options on the map.</p>
                <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 10px;">
                    <a class="btn btn-primary" href="{% url 'finder' %}"><i class='bx bx-map'></i> Back to the map</a>
                    <a class="btn btn-ghost" href="{% url 'savedparking' %}"><i class='bx bx-bookmark'></i> Saved spots</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
