{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Reset password — ParkVenue</title>
   <link rel="icon" type="image/png" href="{% static 'img/park.png' %}">
   <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
   <link rel="stylesheet" href="{% static 'css/parkvenue.css' %}">
</head>
<body>
   <div class="auth-page">
      <aside class="auth-side">
         <a class="brand" href="/">
            <img src="{% static 'img/park.png' %}" alt="ParkVenue logo">
            <span>ParkVenue</span>
         </a>
         <img class="art" src="{% static 'img/finder.webp' %}" alt="Driver illustration">
         <div class="side-quote">
            <b>Locked out? It happens.</b>
            Enter your email and we'll send a one-time code to get you back in.
         </div>
      </aside>

      <main class="auth-main">
         <div class="auth-card">
            <h1>Forgot your password?</h1>
            <p class="auth-sub">We'll email you a one-time code to reset it.</p>

            <form method="POST">
               {% csrf_token %}
               <div class="field">
                  <input type="email" required placeholder=" " name="email" id="email">
                  <label for="email">Enter your email</label>
                  <i class='bx bx-envelope lead-icon'></i>
               </div>

               {% if error %}
               <div class="auth-error"><i class='bx bx-error-circle'></i> {{ error }}</div>
               {% endif %}

               <button type="submit" class="btn btn-primary">Send reset code <i class='bx bx-send'></i></button>
            </form>

            <p class="auth-switch">
               Remembered your password? <button onclick="window.location.href='{% url 'acc' %}'">Log in</button>
            </p>
         </div>
      </main>
   </div>
   <script src="{% static 'js/parkvenue.js' %}"></script>
</body>
</html>
