{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit profile — ParkVenue</title>
    <link rel="icon" type="image/png" href="{% static 'img/park.png' %}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{% static 'css/parkvenue.css' %}">
</head>
<body>
    <div class="bg-glow"></div>
    <div class="app-shell">
        <div class="container">
            <header class="app-topbar">
                <div class="profile">
                    <div class="profile-pic">{{first}}</div>
                    <div class="profile-text">
                        <p>Welcome back <i class='bx bx-smile'></i></p>
                        <h3>{{user.first_name}}</h3>
                    </div>
                </div>
                <div class="menu-icon" onclick="toggleMenu(event)">
                    <i class='bx bx-dots-vertical-rounded'></i>
                    <div class="menu-dropdown" id="menuDropdown">
                        <form action="{% url 'logout' %}" method="POST">
                            {% csrf_token %}
                            <button class="logout-btn" type="submit">
                                <i class='bx bx-log-out'></i> Logout
                            </button>
                        </form>
                    </div>
                </div>
            </header>

            <h1 class="app-title">Edit Profile</h1>
            <p class="app-subtitle">Update your personal details — changes save instantly.</p>

            <div class="panel reveal visible" style="max-width: 640px; margin: 0 auto;">
                <form method="POST">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="field">
                            <input type="text" required placeholder=" " name="first_name" id="fn" value="{{ user.first_name }}">
                            <label for="fn">First name</label>
                            <i class='bx bx-user lead-icon'></i>
                        </div>
                        <div class="field">
                            <input type="text" required placeholder=" " name="last_name" id="ln" value="{{ user.last_name }}">
                            <label for="ln">Last name</label>
                            <i class='bx bx-user lead-icon'></i>
                        </div>
                        <div class="field full">
                            <label style="position: static; display: block; margin-bottom: 6px; font-size: 0.78rem; font-weight: 600; color: var(--text-dim);">Email (locked)</label>
                            <input type="email" class="field-plain" name="email" value="{{ user.email }} " disabled style="opacity: 0.6;">
                        </div>
                        <div class="field full">
                            <input type="tel" placeholder=" " name="phone" id="ph" value="{{ user.mobile }}">
                            <label for="ph">Phone number</label>
                            <i class='bx bx-phone lead-icon'></i>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="margin-top: 26px; width: 100%;">
                        <i class='bx bx-check'></i> Save changes
                    </button>
                </form>
                {% if messages %}
                {% for message in messages %}
                <div class="status-badge status-confirmed" style="margin-top: 18px; width: 100%; justify-content: center;">
                    <i class='bx bx-check-circle'></i> {{ message }}
                </div>
                {% endfor %}
                {% endif %}
            </div>

            <nav class="bottom-nav">
                <button class="nav-btn" onclick="window.location.href='{% url 'home' %}'">
                    <i class='bx bx-home'></i>
                    <span>Home</span>
                </button>
                <button class="nav-btn active" onclick="window.location.href='{% url 'proinfo' %}'">
                  <i class='bx bx-user'></i>
                    <span>Profile</span>
                </button>
                <button class="nav-btn" onclick="window.location.href='{% url 'addspot' %}'">
                  <i class='bx bx-add-to-queue'></i>
                  <span>Add Spot</span>
                </button>
                <button class="nav-btn" onclick="window.location.href='{% url 'managepark' %}'">
                  <i class='bx bxs-parking'></i>
                  <span>My Spots</span>
              </button>
                <button class="nav-btn" onclick="window.location.href='{% url 'reservation' %}'">
                    <i class='bx bx-calendar-check'></i>
                    <span>Reservation</span>
                </button>
              </nav>
        </div>
    </div>
    <script src="{% static 'js/parkvenue.js' %}"></script>
</body>
</html>
